services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: barenest
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d barenest']
      interval: 2s
      timeout: 5s
      retries: 15

  # One-off job: applies pending migrations, then exits
  migrate:
    build:
      context: .
      target: build
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/barenest?schema=public
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/barenest?schema=public
      PORT: 3000
    ports:
      - '3000:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
